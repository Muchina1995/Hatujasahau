name: Build case index

on:
  push:
    paths:
      - "data/cases/**/*.json"
      - "!data/cases/index.json"  # avoid retriggering on its own commit
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build index.json
        run: python .github/scripts/build_case_index.py

      - name: Commit index
        run: |
          git config user.name "hatujasahau-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cases/index.json
          git diff --cached --quiet || git commit -m "Rebuild case index"
          git push
